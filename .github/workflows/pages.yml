# Publica o app no GitHub Pages.
# Configuração (uma vez): Settings → Pages → Source: "GitHub Actions".
# Credenciais do APP (permissões restritas — ADR-0001), em Settings → Secrets and variables → Actions:
#   variável TURSO_DATABASE_URL e UM destes:
#   · secret TURSO_API_TOKEN (recomendado, 100% web): chave de API do painel do Turso; o token do app é gerado
#     aqui a cada publicação (scripts/gerar-token-app.sh) — ninguém copia token;
#   · secret TURSO_APP_TOKEN: token do app gerado à mão (turso db tokens create …).
# Republica toda segunda-feira para renovar o token (validade de 90 dias).
# Antes de publicar, aplica as migrações pendentes (job migrar, Secrets do ambiente producao).
# Sem o token, o site é publicado em MODO DEMONSTRAÇÃO (banco temporário no navegador).
name: Publicar app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Antes de publicar, aplica as migrações pendentes: o site novo nunca chega antes da estrutura do banco que ele usa,
  # e o token do app gerado logo depois já enxerga as tabelas novas. Se a migração falhar, nada é publicado.
  migrar:
    runs-on: ubuntu-24.04
    environment: producao
    concurrency:
      group: migracao-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Aplicar migrações pendentes
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::warning::Sem TURSO_DATABASE_URL/TURSO_AUTH_TOKEN no ambiente producao: migrações não aplicadas."
            exit 0
          fi
          npm run migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  montar:
    needs: migrar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gerar token do app (Turso)
        run: bash scripts/gerar-token-app.sh
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_DB_NAME: ${{ vars.TURSO_DB_NAME }}
      - name: Montar site
        run: npm run site
        env:
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
          TURSO_APP_TOKEN: ${{ env.TURSO_APP_TOKEN_GERADO || secrets.TURSO_APP_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true   # mantém o .nojekyll
  publicar:
    needs: montar
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
