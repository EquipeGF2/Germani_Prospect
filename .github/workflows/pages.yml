# Publica o app no GitHub Pages.
# Configuração (uma vez): Settings → Pages → Source: "GitHub Actions".
# Credenciais do APP (permissões restritas — ADR-0001), em Settings → Secrets and variables → Actions:
#   variável TURSO_DATABASE_URL · secret TURSO_APP_TOKEN
# Sem o token, o site é publicado em MODO DEMONSTRAÇÃO (banco temporário no navegador).
name: Publicar app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  montar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Montar site
        run: npm run site
        env:
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL }}
          TURSO_APP_TOKEN: ${{ secrets.TURSO_APP_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true   # mantém o .nojekyll
  publicar:
    needs: montar
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
