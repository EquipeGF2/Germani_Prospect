name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # regras e importações: SQLite em memória; nunca acessa o Turso
      - run: npm test
      # telas no navegador (modo demonstração) com o Chrome do runner
      - run: npm run test:telas
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
